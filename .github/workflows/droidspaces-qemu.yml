name: Droidspaces QEMU deployer

on:
  push:
    branches: [main]
    paths:
      - "scripts/droidspaces-qemu.sh"
      - ".github/workflows/droidspaces-qemu.yml"
      - "README.md"
  pull_request:
    paths:
      - "scripts/droidspaces-qemu.sh"
      - ".github/workflows/droidspaces-qemu.yml"
      - "README.md"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax validation
        run: |
          bash -n scripts/droidspaces-qemu.sh

      - name: Validate script usage
        run: |
          ./scripts/droidspaces-qemu.sh help

      - name: Ensure script is executable
        run: |
          chmod +x scripts/droidspaces-qemu.sh
