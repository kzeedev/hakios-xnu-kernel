name: HakiOS Open QEMU bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hakios-open-qemu.yml"
      - "scripts/**"
      - "Makefile"
      - "qemu/**"
      - "configs/**"
      - "xnuloader/**"
      - "userland/**"
      - "prebuilt/**"
  pull_request:
    paths:
      - ".github/workflows/hakios-open-qemu.yml"
      - "scripts/**"
      - "Makefile"
      - "qemu/**"
      - "configs/**"
      - "xnuloader/**"
      - "userland/**"
      - "prebuilt/**"
  workflow_dispatch:

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DEBIAN_FRONTEND: noninteractive
      THEOS: ${{ github.workspace }}/.theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git python3 \
            clang lld flex bison m4 perl autoconf automake \
            xz-utils tar make qemu-system-arm qemu-efi-aarch64 qemu-utils

      - name: Install Theos Linux toolchain and iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          curl -fL --retry 3 \
            https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma \
            -o "$tmp/toolchain.tar.lzma"
          tar --lzma -xf "$tmp/toolchain.tar.lzma" -C "$tmp"
          toolchain_dir="$(find "$tmp" -mindepth 1 -maxdepth 4 -type d -name ios-arm64e-clang-toolchain -print -quit)"
          if [ -z "$toolchain_dir" ]; then
            echo "Could not find ios-arm64e-clang-toolchain in downloaded archive; extracted paths:" >&2
            find "$tmp" -mindepth 1 -maxdepth 3 -print >&2
            exit 1
          fi
          cp -a "$toolchain_dir/." "$THEOS/toolchain/linux/iphone/"

          # GitHub's HTTP/2 transport can intermittently fail on large filtered
          # clones. Retry the SDK checkout over HTTP/1.1, then verify the SDK.
          sdk_repo="$tmp/sdks"
          clone_ok=false
          for attempt in 1 2 3; do
            rm -rf "$sdk_repo"
            if git -c http.version=HTTP/1.1 clone --depth 1 --filter=blob:none --sparse \
              https://github.com/theos/sdks.git "$sdk_repo"; then
              clone_ok=true
              break
            fi
            echo "SDK repository clone attempt $attempt failed; retrying..." >&2
            sleep "$attempt"
          done
          if [ "$clone_ok" != true ]; then
            echo "Failed to clone https://github.com/theos/sdks.git after 3 attempts" >&2
            exit 1
          fi

          git -C "$sdk_repo" sparse-checkout set iPhoneOS16.5.sdk
          if [ ! -d "$sdk_repo/iPhoneOS16.5.sdk/usr/include" ]; then
            echo "The SDK checkout is missing iPhoneOS16.5.sdk/usr/include" >&2
            find "$sdk_repo" -mindepth 1 -maxdepth 2 -print >&2
            exit 1
          fi
          cp -a "$sdk_repo/iPhoneOS16.5.sdk" "$THEOS/sdks/"

          test -x "$THEOS/toolchain/linux/iphone/ld"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include"

      - name: Bootstrap XNU build environment
        shell: bash
        run: |
          set -euo pipefail
          source ./xnu-env.sh
          xnu/apply.sh
          xnu-deps/setup.sh

      - name: Build with repository scripts
        run: |
          make kernel loader-open hello
          xnuloader/mkpayload.py -o qemu/payload.bin \
            kernel=hakios-kernel \
            ramdisk=userland/hello \
            --cmdline "$(tools/hakios-config.py args --defconfig defconfig)"
          make prebuilt

      - name: Check whether open-kernel pieces already exist
        id: check
        run: |
          if [ -f prebuilt/hakios-kernel ] && [ -f prebuilt/loader.efi ] && [ -f userland/hello ] && [ -f qemu/payload.bin ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the open-kernel HakiOS image if needed
        if: steps.check.outputs.needs_build == 'true'
        run: |
          make kernel loader-open hello
          make qemu-open

      - name: Prepare bundle
        run: |
          mkdir -p dist
          cp -a prebuilt dist/
          cp -a qemu dist/
          cp -a userland dist/
          cp -a scripts dist/
          tar -czf hakios-qemu-open-bundle.tar.gz -C dist .

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: hakios-qemu-open-bundle
          path: hakios-qemu-open-bundle.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release asset (optional)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" hakios-qemu-open-bundle.tar.gz || echo "No release tag; skipping asset upload"
